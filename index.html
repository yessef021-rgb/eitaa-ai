<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📚 راهنمای جامع ویندوز | برنامک ایتا</title>
<!-- 🔹 کیت توسعه‌دهنده ایتا (Eitaa Web App SDK) -->
<script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
<style>
/* ==================== ریست و تنظیمات کلی ==================== */
:root {
  --bg-color: #0f172a;
  --card-bg: #1e293b;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --primary: #0ea5e9;
  --primary-hover: #0284c7;
  --border-color: #334155;
  --code-bg: #0f172a;
  --kbd-bg: #334155;
  --kbd-shadow: #1e293b;
  --success: #22c55e;
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Tahoma', 'Vazir', 'Segoe UI', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  user-select: none;
  position: fixed;
  touch-action: manipulation;
  background: #0f172a;
}

body {
  color: var(--text-main);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ==================== صفحه شروع ==================== */
.screen {
  display: none;
  position: fixed;
  inset: 0;
  padding: 15px;
  overflow-y: auto;
  animation: fadeIn 0.5s ease;
  z-index: 10;
}

.screen.active {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.98); }
  to   { opacity: 1; transform: scale(1); }
}

#startScreen {
  background: linear-gradient(135deg, #1e3c72 0%, #7e57c2 50%, #e91e63 100%);
  background-size: 400% 400%;
  animation: bgShift 15s ease infinite;
}

@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.start-container {
  width: 100%;
  max-width: 520px;
  background: rgba(255,255,255,0.97);
  border-radius: 35px;
  padding: 30px 25px;
  box-shadow: 0 25px 80px rgba(0,0,0,0.5), 0 0 60px rgba(126,87,194,0.4);
  text-align: center;
  position: relative;
  border: 4px solid transparent;
  background-clip: padding-box;
}

.start-container::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 35px;
  padding: 4px;
  background: linear-gradient(135deg, #e91e63, #ffd60a, #06d6a0, #4da6ff, #7e57c2, #e91e63);
  background-size: 300% 300%;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: borderRotate 5s linear infinite;
  z-index: -1;
}

@keyframes borderRotate {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}

.teacher-photo-wrapper {
  position: relative;
  width: 130px;
  height: 130px;
  margin: 0 auto 20px;
}

.teacher-photo {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 5px solid #4da6ff;
  background: linear-gradient(135deg, #4da6ff, #1e3c72);
  box-shadow: 0 8px 30px rgba(30,60,114,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  overflow: hidden;
  position: relative;
  z-index: 2;
}

.teacher-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.photo-ring {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px dashed #4da6ff;
  animation: ringRotate 10s linear infinite;
  z-index: 1;
}

.photo-ring.ring2 {
  inset: -20px;
  border: 3px dotted #e91e63;
  animation: ringRotate 15s linear infinite reverse;
}

@keyframes ringRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.game-title {
  font-size: 26px;
  margin: 15px 0 10px;
  font-weight: 900;
  background: linear-gradient(90deg, #e91e63, #7e57c2, #1e3c72, #4da6ff, #e91e63);
  background-size: 300% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: titleShine 3s linear infinite;
}

@keyframes titleShine {
  to { background-position: 300% center; }
}

.game-subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 20px;
  font-weight: bold;
}

.info-box {
  background: linear-gradient(135deg, #f8f9fa, #e9ecef);
  border-radius: 20px;
  padding: 15px 20px;
  margin: 20px 0;
  border: 2px dashed #4da6ff;
}

.info-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 5px 0;
  font-size: 15px;
}

.info-row + .info-row { border-top: 1px dashed #ccc; }
.info-icon { font-size: 20px; }
.info-label { color: #666; font-weight: bold; }
.teacher-name { color: #1e3c72; font-weight: bold; font-size: 16px; }
.teacher-phone { color: #e91e63; font-weight: bold; direction: ltr; font-size: 16px; }

.big-btn {
  background: linear-gradient(135deg, #1e3c72, #7e57c2, #e91e63);
  background-size: 200% 200%;
  color: #fff;
  border: none;
  padding: 16px 45px;
  font-size: 22px;
  font-weight: bold;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 8px 0 #4a148c, 0 15px 35px rgba(126,87,194,0.5);
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  animation: btnGradient 3s ease infinite;
  position: relative;
  overflow: hidden;
  margin: 10px 0;
  transition: transform 0.15s;
}

@keyframes btnGradient {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.big-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: btnShine 3s linear infinite;
}

@keyframes btnShine { to { left: 100%; } }
.big-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #4a148c; }

.logo-wrapper {
  margin-top: 15px;
  padding-top: 15px;
  border-top: 2px dashed #4da6ff;
}

.logo-fallback {
  font-size: 20px;
  display: inline-block;
  padding: 10px 22px;
  background: linear-gradient(135deg, #1e3c72, #7e57c2);
  border-radius: 18px;
  color: #fff;
  font-weight: bold;
}

.copyright { font-size: 12px; color: #888; margin-top: 12px; }

/* دکمه موسیقی */
.music-toggle {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1e3c72, #7e57c2);
  color: #fff;
  border: 3px solid #fff;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 5px 20px rgba(0,0,0,0.4);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  font-family: inherit;
  padding: 0;
}

.music-toggle:hover { transform: scale(1.1); }
.music-toggle:active { transform: scale(0.95); }
.music-toggle.muted {
  background: linear-gradient(135deg, #999, #666);
  opacity: 0.8;
}

/* ==================== صفحه اصلی راهنما ==================== */
#mainScreen {
  background-color: var(--bg-color);
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  overflow-y: auto;
  justify-content: flex-start;
}

#mainScreen.active {
  display: flex;
}

.container {
  width: 100%;
  max-width: 1000px;
}

header {
  text-align: center;
  margin-bottom: 30px;
  margin-top: 10px;
}

header h1 {
  font-size: 2rem;
  color: var(--primary);
  margin-bottom: 10px;
}

header p {
  color: var(--text-muted);
  font-size: 1rem;
}

.search-box {
  position: relative;
  margin-bottom: 20px;
}

.search-box input {
  width: 100%;
  padding: 15px 20px;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  background-color: var(--card-bg);
  color: var(--text-main);
  font-size: 1rem;
  outline: none;
  transition: all 0.3s ease;
}

.search-box input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
}

.search-box input::placeholder {
  color: var(--text-muted);
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
  border-bottom: 2px solid var(--border-color);
  padding-bottom: 10px;
  overflow-x: auto;
}

.tab-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  padding: 10px 20px;
  font-size: 1rem;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.3s ease;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tab-btn:hover {
  color: var(--text-main);
  background-color: var(--card-bg);
}

.tab-btn.active {
  color: var(--primary);
  background-color: rgba(14, 165, 233, 0.1);
  font-weight: bold;
}

.tab-btn.active.danger-tab {
  color: var(--danger);
  background-color: var(--danger-bg);
}

.tab-count {
  background-color: var(--border-color);
  color: var(--text-main);
  font-size: 0.75rem;
  padding: 2px 8px;
  border-radius: 20px;
}

.tab-btn.active .tab-count {
  background-color: var(--primary);
  color: #fff;
}

.tab-btn.active.danger-tab .tab-count {
  background-color: var(--danger);
}

.tab-content {
  display: none;
  animation: fadeIn 0.4s ease;
}

.tab-content.active {
  display: block;
}

.card-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 15px;
}

.card {
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: 18px;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  position: relative;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
  border-color: var(--primary);
}

.card.danger-card {
  border-color: #7f1d1d;
}

.card.danger-card:hover {
  border-color: var(--danger);
  box-shadow: 0 10px 20px rgba(239, 68, 68, 0.15);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 10px;
}

.card-title {
  font-size: 1.1rem;
  font-weight: bold;
  color: var(--text-main);
}

.card-tag {
  font-size: 0.75rem;
  background-color: rgba(14, 165, 233, 0.15);
  color: var(--primary);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid rgba(14, 165, 233, 0.3);
}

.card-tag.danger-tag {
  background-color: var(--danger-bg);
  color: var(--danger);
  border-color: rgba(239, 68, 68, 0.3);
}

.card-desc {
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.cmd-box {
  background-color: var(--code-bg);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 10px 15px;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 0.95rem;
  color: #a5f3fc;
  direction: ltr;
  text-align: left;
  cursor: pointer;
  transition: background-color 0.2s;
  user-select: all;
  position: relative;
  overflow-x: auto;
  white-space: nowrap;
  margin-bottom: 10px;
}

.cmd-box:hover {
  background-color: #1a2333;
}

.cmd-box::after {
  content: '📋 کپی';
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.75rem;
  color: var(--text-muted);
  opacity: 0;
  transition: opacity 0.2s;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  direction: rtl;
}

.cmd-box:hover::after {
  opacity: 1;
}

.keys-box {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  direction: ltr;
  justify-content: flex-start;
}

kbd {
  background-color: var(--kbd-bg);
  border: 1px solid #475569;
  border-bottom: 3px solid var(--kbd-shadow);
  border-radius: 6px;
  padding: 6px 12px;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  font-size: 0.85rem;
  color: var(--text-main);
  min-width: 40px;
  text-align: center;
  box-shadow: 0 2px 0 rgba(0,0,0,0.2);
}

.treatment-box {
  background-color: var(--danger-bg);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 8px;
  padding: 12px 15px;
  margin-top: 10px;
  font-size: 0.9rem;
  color: #fca5a5;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.treatment-box::before {
  content: '💊';
  font-size: 1.2rem;
}

#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background-color: var(--success);
  color: #fff;
  padding: 12px 24px;
  border-radius: 50px;
  font-weight: bold;
  box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  z-index: 10000;
  display: flex;
  align-items: center;
  gap: 8px;
}

#toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

#toast.danger-toast {
  background-color: var(--danger);
  box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
}

.empty-state {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
  grid-column: 1 / -1;
}

/* ==================== واکنش‌گرا ==================== */
@media (min-width: 768px) {
  .card-grid { grid-template-columns: 1fr 1fr; }
  header h1 { font-size: 2.5rem; }
}

@media (max-width: 600px) {
  .game-title { font-size: 20px; }
  .teacher-photo-wrapper { width: 120px; height: 120px; }
  .big-btn { font-size: 18px; padding: 14px 30px; }
  .music-toggle { width: 48px; height: 48px; font-size: 20px; bottom: 15px; left: 15px; }
  .container { padding: 0 5px; }
  .card-header { flex-direction: column; align-items: flex-start; }
  .tabs { gap: 5px; }
  .tab-btn { padding: 8px 12px; font-size: 0.9rem; }
  .cmd-box { font-size: 0.85rem; }
}
</style>
</head>
<body>

<!-- ==================== دکمه موسیقی ==================== -->
<button id="musicToggle" class="music-toggle" title="روشن/خاموش موسیقی">🔇</button>

<!-- ==================== آهنگ پس‌زمینه ==================== -->
<audio id="bgMusic" loop preload="auto">
    <source src="bg-music.mp3" type="audio/mpeg">
</audio>

<!-- ==================== صفحه شروع ==================== -->
<div id="startScreen" class="screen active">
    <div class="start-container">
        <div class="teacher-photo-wrapper">
            <div class="teacher-photo" id="teacherPhoto">👩‍🏫</div>
            <div class="photo-ring"></div>
            <div class="photo-ring ring2"></div>
        </div>

        <h1 class="game-title">📚 راهنمای جامع ویندوز</h1>
        <p class="game-subtitle">دستورات، میان‌برها و کدهای خطرناک</p>

        <div class="info-box">
            <div class="info-row">
                <span class="info-icon">👨‍💻</span>
                <span class="info-label">توسعه‌دهنده:</span>
                <span class="teacher-name">پیام نور</span>
            </div>
            <div class="info-row">
                <span class="info-icon">📞</span>
                <span class="info-label">تماس:</span>
                <span class="teacher-phone">09222517707</span>
            </div>
        </div>

        <button id="startBtn" class="big-btn">🚀 ورود به راهنما</button>

        <div class="logo-wrapper">
            <div class="logo-fallback" id="logoFallback">📚 راهنما 📚</div>
        </div>
        <div class="copyright">© ۱۴۰۴ - تمامی حقوق محفوظ است</div>
    </div>
</div>

<!-- ==================== صفحه اصلی راهنما ==================== -->
<div id="mainScreen" class="screen">
  <div class="container">
    <header>
      <h1>🪟 راهنمای جامع ویندوز</h1>
      <p>دستورات کنترل پنل، میان‌برهای کیبورد و کدهای خطرناک با راه درمان</p>
    </header>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 جستجو در نام، دستور یا توضیحات...">
    </div>
    
    <div class="tabs">
      <button class="tab-btn active" data-tab="control-panel">⚙️ کنترل پنل <span class="tab-count" id="count-cp">0</span></button>
      <button class="tab-btn" data-tab="shortcuts">⌨️ میان‌برهای عمومی <span class="tab-count" id="count-sc">0</span></button>
      <button class="tab-btn danger-tab" data-tab="dangerous">☠️ کدهای خطرناک <span class="tab-count" id="count-dg">0</span></button>
    </div>
    
    <div id="control-panel" class="tab-content active">
      <div class="card-grid" id="grid-cp"></div>
    </div>
    
    <div id="shortcuts" class="tab-content">
      <div class="card-grid" id="grid-sc"></div>
    </div>
    
    <div id="dangerous" class="tab-content">
      <div class="card-grid" id="grid-dg"></div>
    </div>
    
    <!-- 🔹 دکمه بستن برنامک (مخصوص ایتا) -->
    <div style="text-align: center; margin-top: 25px; margin-bottom: 30px;">
      <button onclick="window.Eitaa?.WebApp.close()" style="background: rgba(255,255,255,0.1); border: 1px solid #334155; color: #94a3b8; padding: 10px 25px; border-radius: 30px; cursor: pointer; font-family: inherit;">✖️ بستن برنامه</button>
    </div>
  </div>
</div>

<div id="toast">✅ دستور با موفقیت کپی شد!</div>

<script>
/* ==================== داده‌ها (DATA) ==================== */
const DATA = {
  "کنترل پنل": [
    { name: "تنظیمات نمایشگر", cmd: "desk.cpl", desc: "باز کردن تنظیمات مربوط به نمایشگر و رزولوشن", tag: "نمایش" },
    { name: "تنظیمات صدا", cmd: "mmsys.cpl", desc: "مدیریت دستگاه‌های صوتی و تنظیمات میکروفون", tag: "صدا" },
    { name: "برنامه‌ها و ویژگی‌ها", cmd: "appwiz.cpl", desc: "حذف یا تغییر برنامه‌های نصب شده در ویندوز", tag: "نرم‌افزار" },
    { name: "تنظیمات اینترنت", cmd: "inetcpl.cpl", desc: "تنظیمات مربوط به اتصالات اینترنت و پروکسی", tag: "شبکه" },
    { name: "تاریخ و زمان", cmd: "timedate.cpl", desc: "تنظیم تاریخ، ساعت و منطقه زمانی سیستم", tag: "سیستم" },
    { name: "موس و کیبورد", cmd: "main.cpl", desc: "تنظیمات مربوط به سرعت موس، دکمه‌ها و کیبورد", tag: "سخت‌افزار" },
    { name: "مدیریت انرژی", cmd: "powercfg.cpl", desc: "تنظیمات مربوط به مصرف برق و حالت‌های خواب", tag: "سیستم" },
    { name: "فایروال ویندوز", cmd: "firewall.cpl", desc: "مدیریت امنیت شبکه و تنظیمات فایروال", tag: "امنیت" },
    { name: "گزارش رویدادها", cmd: "eventvwr.msc", desc: "مشاهده لاگ‌ها و رویدادهای سیستم برای عیب‌یابی", tag: "ابزار" },
    { name: "مدیریت دیسک", cmd: "diskmgmt.msc", desc: "پارتیشن‌بندی، فرمت و مدیریت هارد دیسک‌ها", tag: "ذخیره‌سازی" },

/* ==================== اسکریپت اصلی ==================== */
(function() {
  'use strict';

  // ============ المان‌ها ============
  const startScreen = document.getElementById('startScreen');
  const mainScreen = document.getElementById('mainScreen');
  const startBtn = document.getElementById('startBtn');
  const musicToggle = document.getElementById('musicToggle');
  const bgMusic = document.getElementById('bgMusic');
  const searchInput = document.getElementById('searchInput');
  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabContents = document.querySelectorAll('.tab-content');
  const gridCP = document.getElementById('grid-cp');
  const gridSC = document.getElementById('grid-sc');
  const gridDG = document.getElementById('grid-dg');
  const countCP = document.getElementById('count-cp');
  const countSC = document.getElementById('count-sc');
  const countDG = document.getElementById('count-dg');
  const toast = document.getElementById('toast');
  const teacherPhoto = document.getElementById('teacherPhoto');
  const logoFallback = document.getElementById('logoFallback');

  // ============ 🔹 بررسی اتصال به ایتا ============
  if (window.Eitaa) {
    console.log("برنامک در محیط ایتا اجرا می‌شود.");
    // اگر نیاز به اطلاعات کاربر دارید:
    // const userData = window.Eitaa.WebApp.initData;
    // console.log("اطلاعات کاربر:", userData);
  } else {
    console.log("برنامک در محیط ایتا اجرا نمی‌شود (حالت مرورگر).");
  }

  // ============ موسیقی ============
  let musicPlaying = false;

  function startMusic() {
    if (!bgMusic) return;
    bgMusic.volume = 0.3;
    const p = bgMusic.play();
    if (p !== undefined) {
      p.then(() => {
        musicPlaying = true;
        musicToggle.textContent = '🎵';
        musicToggle.classList.remove('muted');
      }).catch(() => {
        musicPlaying = false;
      });
    }
  }

  function stopMusic() {
    if (bgMusic) {
      bgMusic.pause();
      musicPlaying = false;
      musicToggle.textContent = '🔇';
      musicToggle.classList.add('muted');
    }
  }

  if (musicToggle) {
    musicToggle.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (musicPlaying) {
        stopMusic();
      } else {
        startMusic();
      }
    });
  }

  // ============ عکس مدرس ============
  if (teacherPhoto) {
    const tImg = new Image();
    tImg.onload = function() {
      teacherPhoto.textContent = '';
      tImg.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;';
      teacherPhoto.appendChild(tImg);
    };
    tImg.src = 'teacher.jpg';
  }

  // ============ لوگو ============
  if (logoFallback) {
    const lImg = new Image();
    lImg.onload = function() {
      lImg.style.cssText = 'max-width:130px;height:auto;';
      logoFallback.parentNode.replaceChild(lImg, logoFallback);
    };
    lImg.src = 'logo.png';
  }

  // ============ دکمه شروع ============
  if (startBtn) {
    startBtn.addEventListener('click', (e) => {
      e.preventDefault();
      startMusic();
      startScreen.classList.remove('active');
      mainScreen.classList.add('active');
      renderData();
    });
  }

  // ============ توابع کپی و Toast ============
  let toastTimeout;
  function showToast(message, isDanger = false) {
    toast.textContent = message;
    toast.className = isDanger ? 'danger-toast show' : 'show';
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      toast.classList.remove('show');
      toast.className = '';
    }, 2000);
  }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('✅ دستور با موفقیت کپی شد!');
    }).catch(() => {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast('✅ دستور با موفقیت کپی شد!');
      } catch (err) {
        showToast('❌ خطا در کپی کردن!', true);
      }
      document.body.removeChild(textArea);
    });
  }

  // ============ ساخت کارت‌ها ============
  function createCmdCard(item, isDanger = false) {
    const card = document.createElement('div');
    card.className = isDanger ? 'card danger-card' : 'card';
    
    const tagClass = isDanger ? 'card-tag danger-tag' : 'card-tag';
    const tagHtml = item.tag ? `<span class="${tagClass}">${item.tag}</span>` : '';
    
    const treatmentHtml = item.treatment ? `
      <div class="treatment-box">
        <div>${item.treatment}</div>
      </div>
    ` : '';

    card.innerHTML = `
      <div class="card-header">
        <span class="card-title">${item.name}</span>
        ${tagHtml}
      </div>
      <p class="card-desc">${item.desc}</p>
      <div class="cmd-box" title="برای کپی کلیک کنید">${item.cmd}</div>
      ${treatmentHtml}
    `;
    
    const cmdBox = card.querySelector('.cmd-box');
    cmdBox.addEventListener('click', () => {
      copyToClipboard(item.cmd);
    });

    return card;
  }

  function createShortcutCard(item) {
    const card = document.createElement('div');
    card.className = 'card';
    const keysHtml = item.keys.map(k => `<kbd>${k}</kbd>`).join(' + ');
    card.innerHTML = `
      <div class="card-header">
        <span class="card-title">${item.name}</span>
      </div>
      <p class="card-desc">${item.desc}</p>
      <div class="keys-box">${keysHtml}</div>
    `;
    return card;
  }

  // ============ رندر داده‌ها ============
  function renderData(searchTerm = '') {
    const term = searchTerm.toLowerCase().trim();
    
    gridCP.innerHTML = '';
    gridSC.innerHTML = '';
    gridDG.innerHTML = '';

    const filteredCP = DATA["کنترل پنل"].filter(item => 
      item.name.toLowerCase().includes(term) || 
      item.cmd.toLowerCase().includes(term) || 
      item.desc.toLowerCase().includes(term) ||
      (item.tag && item.tag.toLowerCase().includes(term))
    );

    const filteredSC = DATA["میان‌برهای عمومی"].filter(item => 
      item.name.toLowerCase().includes(term) || 
      item.desc.toLowerCase().includes(term) ||
      item.keys.some(k => k.toLowerCase().includes(term))
    );

    const filteredDG = DATA["کدهای خطرناک"].filter(item => 
      item.name.toLowerCase().includes(term) || 
      item.cmd.toLowerCase().includes(term) || 
      item.desc.toLowerCase().includes(term) ||
      (item.tag && item.tag.toLowerCase().includes(term)) ||
      (item.treatment && item.treatment.toLowerCase().includes(term))
    );

    countCP.textContent = filteredCP.length;
    countSC.textContent = filteredSC.length;
    countDG.textContent = filteredDG.length;

    if (filteredCP.length === 0) {
      gridCP.innerHTML = `<div class="empty-state">موردی یافت نشد.</div>`;
    } else {
      filteredCP.forEach(item => gridCP.appendChild(createCmdCard(item, false)));
    }

    if (filteredSC.length === 0) {
      gridSC.innerHTML = `<div class="empty-state">موردی یافت نشد.</div>`;
    } else {
      filteredSC.forEach(item => gridSC.appendChild(createShortcutCard(item)));
    }

    if (filteredDG.length === 0) {
      gridDG.innerHTML = `<div class="empty-state">موردی یافت نشد.</div>`;
    } else {
      filteredDG.forEach(item => gridDG.appendChild(createCmdCard(item, true)));
    }
  }

  // ============ رویدادها ============
  searchInput.addEventListener('input', (e) => {
    renderData(e.target.value);
  });

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      const tabId = btn.getAttribute('data-tab');
      document.getElementById(tabId).classList.add('active');
    });
  });

  // ============ مقداردهی اولیه ============
  document.addEventListener('DOMContentLoaded', () => {
    renderData();
    console.log('%c📚 راهنمای جامع ویندوز آماده است!', 'color:#0ea5e9;font-size:18px;font-weight:bold;');
  });

})();
</script>
</body>
</html>
