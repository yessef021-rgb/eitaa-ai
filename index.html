<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نادی - دستیار هوشمند</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: Tahoma, 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; background: #0f0c29; color: #fff; }
.background { position: fixed; inset: 0; background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #6a11cb); background-size: 400% 400%; animation: gradientMove 15s ease infinite; z-index: -1; }
@keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.container { display: flex; flex-direction: column; height: 100vh; max-width: 700px; margin: 0 auto; }
.header { display: flex; align-items: center; gap: 12px; padding: 15px 20px; background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }
.logo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 20px rgba(138,43,226,0.6); border: 2px solid rgba(255,255,255,0.2); }
.header-text h1 { font-size: 18px; font-weight: bold; background: linear-gradient(90deg, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.status { font-size: 12px; color: rgba(255,255,255,0.6); }
.chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
.chat::-webkit-scrollbar { width: 6px; }
.chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
.welcome { text-align: center; padding: 40px 20px; margin: auto; animation: fadeIn 0.8s ease; }
.welcome-logo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; box-shadow: 0 0 40px rgba(138,43,226,0.8); animation: float 3s ease-in-out infinite; }
.welcome h2 { font-size: 22px; margin-bottom: 10px; background: linear-gradient(90deg, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.welcome p { color: rgba(255,255,255,0.6); font-size: 14px; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.message { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.6; word-wrap: break-word; animation: messageIn 0.3s ease; white-space: pre-wrap; }
@keyframes messageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.message.user { align-self: flex-start; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
.message.ai { align-self: flex-end; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-bottom-left-radius: 4px; }
.typing { display: flex; gap: 4px; padding: 4px 0; }
.typing span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.6); animation: typing 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-8px); opacity: 1; } }
.input-area { display: flex; gap: 10px; padding: 15px 20px; background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1); }
.input-area input { flex: 1; padding: 14px 18px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 25px; color: #fff; font-family: inherit; font-size: 14px; outline: none; transition: all 0.3s; }
.input-area input::placeholder { color: rgba(255,255,255,0.4); }
.input-area input:focus { border-color: rgba(168,85,247,0.6); background: rgba(255,255,255,0.15); box-shadow: 0 0 20px rgba(168,85,247,0.3); }
.input-area button { width: 48px; height: 48px; border: none; border-radius: 50%; background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; box-shadow: 0 4px 15px rgba(168,85,247,0.4); }
.input-area button:hover:not(:disabled) { transform: scale(1.05); }
.input-area button:active:not(:disabled) { transform: scale(0.95); }
.input-area button:disabled { background: rgba(255,255,255,0.1); cursor: not-allowed; box-shadow: none; }
</style>
</head>
<body>
<div class="background"></div>
<div class="container">
<header class="header">
<img src="logo.png" alt="نادی" class="logo" onerror="this.style.display='none'">
<div class="header-text">
<h1>نادی</h1>
<span id="status" class="status">در حال آماده‌سازی...</span>
</div>
</header>
<div id="chat" class="chat">
<div class="welcome">
<img src="logo.png" alt="نادی" class="welcome-logo" onerror="this.style.display='none'">
<h2>سلام! من نادی هستم 👋</h2>
<p>هر سوالی داری بپرس، همینجام.</p>
</div>
</div>
<div class="input-area">
<input type="text" id="prompt" placeholder="سوالت رو بنویس..." disabled autocomplete="off">
<button id="send" disabled>
<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
<path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
</svg>
</button>
</div>
</div>

<script type="module">
import { CreateMLCEngine } from 'https://esm.run/@mlc-ai/web-llm@0.2.79';

const MODEL_ID = 'SmolLM2-360M-Instruct-q4f16_1-MLC';
const statusEl = document.getElementById('status');
const chatEl = document.getElementById('chat');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');

let engine = null;
let isFirstMessage = true;
const chatHistory = [
{ role: 'system', content: 'تو نادی هستی، یک دستیار هوشمند فارسی‌زبان. دوستانه، کوتاه و مفید جواب بده. همیشه فارسی جواب بده.' }
];

async function init() {
if (typeof window.Eitaa?.WebApp !== 'undefined') {
window.Eitaa.WebApp.ready();
console.log('SDK ایتا فعال شد');
}
if (!navigator.gpu) {
statusEl.textContent = 'مرورگر شما از WebGPU پشتیبانی نمی‌کند';
return;
}
try {
statusEl.textContent = 'در حال دانلود مدل...';
engine = await CreateMLCEngine(MODEL_ID, {
initProgressCallback: (report) => {
const pct = Math.round(report.progress * 100);
statusEl.textContent = 'دانلود مدل: ' + pct + '%';
}
});
statusEl.textContent = 'آماده‌ام! بپرس ✨';
promptEl.disabled = false;
sendBtn.disabled = false;
promptEl.focus();
} catch (err) {
statusEl.textContent = 'خطا در بارگذاری';
console.error(err);
}
}

function addMessage(text, type) {
const msg = document.createElement('div');
msg.className = 'message ' + type;
msg.textContent = text;
chatEl.appendChild(msg);
chatEl.scrollTop = chatEl.scrollHeight;
return msg;
}

function addTyping() {
const msg = document.createElement('div');
msg.className = 'message ai';
msg.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
chatEl.appendChild(msg);
chatEl.scrollTop = chatEl.scrollHeight;
return msg;
}

async function sendMessage() {
const text = promptEl.value.trim();
if (!text || !engine) return;

if (isFirstMessage) {
const welcome = chatEl.querySelector('.welcome');
if (welcome) welcome.remove();
isFirstMessage = false;
}

addMessage(text, 'user');
promptEl.value = '';
sendBtn.disabled = true;
const typingEl = addTyping();

try {
chatHistory.push({ role: 'user', content: text });
const reply = await engine.chat.completions.create({
messages: chatHistory,
temperature: 0.7,
max_tokens: 512
});
const aiText = reply.choices[0].message.content;
chatHistory.push({ role: 'assistant', content: aiText });
if (chatHistory.length > 12) chatHistory.splice(1, 2);
typingEl.remove();
addMessage(aiText, 'ai');
} catch (err) {
typingEl.remove();
addMessage('متأسفم، خطایی رخ داد. دوباره امتحان کن.', 'ai');
console.error(err);
}

sendBtn.disabled = false;
promptEl.focus();
}

sendBtn.addEventListener('click', sendMessage);
promptEl.addEventListener('keypress', (e) => {
if (e.key === 'Enter') sendMessage();
});

init();
</script>
</body>
</html>
